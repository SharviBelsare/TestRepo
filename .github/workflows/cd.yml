name: CI/CD (testrepo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TestRepo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            echo "No npm test script; skipping"
            exit 0
          fi
          if ! find . -type f \( -name '*.spec.ts' -o -name '*.spec.js' -o -name '*.test.ts' -o -name '*.test.js' -o -name '*.test.tsx' -o -name '*.spec.tsx' \) ! -path './node_modules/*' ! -path './dist/*' ! -path './.angular/*' | grep -q .; then
            echo "No test files found; skipping tests"
            exit 0
          fi
          # Angular/Karma needs non-watch + headless in GitHub Actions
          npm test -- --watch=false --browsers=ChromeHeadless --progress=false
      - name: Build
        run: npm run build --if-present
  deploy:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Skipping Vercel deploy — missing VERCEL_TOKEN or VERCEL_PROJECT_ID (run POST /cicd/deploy-cicd once to sync secrets)."
            exit 0
          fi
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ["VERCEL_TOKEN"].strip()
          org = (os.environ.get("VERCEL_ORG_ID") or "").strip()
          project = os.environ["VERCEL_PROJECT_ID"].strip()
          owner, _, repo = os.environ.get("GITHUB_REPOSITORY", "/").partition("/")
          ref = (
              os.environ.get("GITHUB_HEAD_REF")
              or os.environ.get("GITHUB_REF_NAME")
              or "main"
          ).strip()
          url = "https://api.vercel.com/v13/deployments"
          if org:
              url = f"{url}?teamId={org}"
          body = {
              "name": repo or "app",
              "project": project,
              "target": "production",
              "gitSource": {
                  "type": "github",
                  "org": owner,
                  "repo": repo,
                  "ref": ref,
              },
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  print(f"Vercel deploy HTTP {resp.status}")
                  print(raw[:800])
          except urllib.error.HTTPError as exc:
              err = exc.read().decode("utf-8", errors="replace")
              print(f"Vercel deploy HTTP {exc.code}")
              print(err[:800])
              raise SystemExit(1) from exc
          print("Vercel deployment started")
          PY
